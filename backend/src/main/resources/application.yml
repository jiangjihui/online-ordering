server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${user.dir}/data/ordering.db
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    users:
      - username: admin
        password: admin123
        roles: ADMIN
      - username: kitchen
        password: kitchen123
        roles: KITCHEN

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-handlers-package: com.ordering.config
